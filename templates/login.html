{% extends "base.html" %}{% block content %}
<div class="card"><h2>Login</h2>
<form method="post"><label>Name</label><input name="name" value="{{ u.name or '' }}" required>
<label>Email</label><input name="email" type="email" value="{{ u.email or '' }}" required>
<label>Phone number</label><input name="phone" type="tel" value="{{ u.phone or '' }}" required>
<button>Continue</button></form></div>
{% endblock %}
